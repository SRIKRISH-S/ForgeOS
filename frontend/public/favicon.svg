<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="neonGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#AAFF00" />
      <stop offset="100%" stop-color="#00E8CC" />
    </linearGradient>
    <linearGradient id="flameGrad" x1="0%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#CCFF33" />
      <stop offset="50%" stop-color="#AAFF00" />
      <stop offset="100%" stop-color="#00E8CC" />
    </linearGradient>
    <filter id="hexGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Dark Background Squircle -->
  <rect width="512" height="512" rx="115" fill="#07070E"/>

  <!-- Glowing Hexagon Frame -->
  <polygon points="256,70 415,162 415,346 256,438 97,346 97,162"
           fill="none"
           stroke="url(#neonGradient)"
           stroke-width="14"
           stroke-linejoin="round"
           filter="url(#hexGlow)" />

  <!-- Inner Ambient Glow -->
  <circle cx="256" cy="256" r="120" fill="url(#neonGradient)" opacity="0.12" filter="blur(30px)"/>

  <!-- Forge Flame Outer Wing -->
  <path d="M 256 140 
           C 270 200, 340 230, 340 310
           C 340 370, 280 400, 256 400
           C 232 400, 172 370, 172 310
           C 172 230, 242 200, 256 140 Z"
        fill="url(#flameGrad)"
        opacity="0.25" />

  <!-- Stylized Flame & Central Lightning Spark -->
  <g filter="url(#hexGlow)">
    <!-- Left Flame Tongue -->
    <path d="M 230 180 
             C 210 240, 180 270, 180 320 
             C 180 360, 210 380, 230 385 
             C 200 360, 205 300, 230 260 Z" 
          fill="url(#neonGradient)" />

    <!-- Right Flame Tongue -->
    <path d="M 282 180 
             C 302 240, 332 270, 332 320 
             C 332 360, 302 380, 282 385 
             C 312 360, 307 300, 282 260 Z" 
          fill="url(#neonGradient)" />

    <!-- Center Lightning Bolt Forge Spark -->
    <polygon points="270,160 216,270 256,270 240,360 300,246 258,246"
             fill="#AAFF00"
             stroke="#07070E"
             stroke-width="3"
             stroke-linejoin="miter" />
  </g>
</svg>
